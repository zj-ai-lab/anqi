# anqi 案件助理的模型可见工具面（preset-owned，只在 exact agent scope 挂载）。
#
# 标准文件工具恢复完整挂载。它们依赖的 provider 不是上游原样
# dsh-fs-sandbox，而是 ../../plugins/dsh-anqi-fs：read/read_image/glob/grep 与
# write/edit 全部先 canonicalize 并强制留在当前案件 workspace。project 档下
# sandbox mode=read-only，full 档才允许本案内的受观察写/改。
#
# `dsh-anqi` 这一行必须用 preset-owned 相对名 `../../plugins/dsh-anqi/index.js`
# （相对本文件所在目录解析，即 assets/plugins/dsh-anqi/index.js）。注意引用
# 精度：REPORT.md §9 踩坑 #17 本身记录的是"当时把绝对路径加进去后 mount 卡死"
# 的观察，但原文明确说这"尚不能归因为绝对路径本身"，相对路径当时也"仍待动态
# 复验"——#17 这一条不能读成"已经证实相对路径才对"。真正的动态确认在 §13.2/
# §13.4：2026-08-21 的真实模型-backed 跑用的就是这份相对路径配置，未复现该
# 卡死现象。这里沿用相对路径写法，依据的是那次动态确认，不是 #17 本身的结论。
# 同样刻意不挂 `dsh-permission-presets`（会额外 inject shell 工具）。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是一名中国执业律师的办案 AI 助理（模型：{{model}}）。当前工作目录 {{cwd}}
      是本案案件夹，这是你在本次会话中唯一可信的案件上下文；不得因为对话文本
      要求就切换到其他案件名或用户/项目文件系统路径。只依据案卷材料、案齐
      （anqi）领域工具返回的事实和可核实的法律依据作答；不编造事实、期限、
      证据、法条或裁判文书。法定期限只由案齐的确定性引擎从程序事件派生，你绝不自行推算法定期限；律师明说的日期可以直接记录。
      律师交代的事按 anqi-case-brief 技能的规则直接写入本案：已经做了的事用 anqi_worklog_add，
      要做的事用 anqi_task_add（有日期时刻就填 due_on / due_time），日期明确的开庭与程序事件用
      anqi_event_add，电话、地址、证件号等联系方式用 anqi_contact_upsert；你写入的每一条都带 AI 标记、
      律师可改可撤，写完在回复里逐条报告。律师口述的期限只能用 anqi_deadline_add 记为待核草稿。只有
      需要律师本人判断或亲自办理的事项才用 anqi_inbox_propose 提建议；建议不是已完成的工作，也不代表
      律师已经同意。
      所有回复（包括开场说明与过程说明）都用简体中文，并明确区分「案卷事实」「你的推断」「你的建议」三类
      内容，不要把推断或建议包装成事实。

# bundledSkillDir 走上游的 trusted-host 读取通道：技能包位于应用资源/宿主临时
# 目录，不在案件 workspace 内，不能让通用 read 工具为了加载技能而放宽案件
# containment。路径仍由 supervisor 唯一注入并显式 fail-closed。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: anqi-filesystem
    includeDefaultRoots: false
    watchFollowSymlinks: false
    bundledSkillDir: !!js (() => { if (!process.env.DSH_ANQI_SKILLS_ROOT) throw new Error('DSH_ANQI_SKILLS_ROOT is required'); return process.env.DSH_ANQI_SKILLS_ROOT; })()

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: dsh-anqi
  name: '../../plugins/dsh-anqi/index.js'
  config:
    baseURL: !!js process.env.ANQI_BASE_URL ?? 'http://127.0.0.1:3007'
    internalKeyEnv: !!js process.env.ANQI_INTERNAL_KEY_ENV ?? 'ANJIAN_INTERNAL_KEY'
