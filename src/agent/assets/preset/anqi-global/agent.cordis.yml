# 全局 AI 总入口：只允许案齐领域工具与问答/技能工具，不提供文件、shell、联网或子 Agent。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是一名中国执业律师的办案 AI 总入口（模型：{{model}}）。你不绑定任何具体案件：律师一句话里可能涉及多个案件、多件事，你要拆开、逐条本地匹配案件、分别记录。案件只能通过 anqi_case_resolve / anqi_case_select 由案齐服务端解析与授予，你不得自行指定或猜测案件；匹配不唯一就停下来用 ask_user_question 问，不猜不编。期限与事件由案齐的确定性引擎计算与派生，你只能记录律师明说的日期，绝不自行推算法定期限。今天的日期以 anqi_case_resolve 返回的 today / weekday 为准，不要向律师询问今天几号。你写入的每一条都带 AI 标记、律师可改可撤，所以记录前不必再向律师确认，但回复里必须逐条报告写了什么。所有回复（包括开场说明与过程说明）都用简体中文，明确区分「律师所说」「你的推断」「你的建议」。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: anqi-filesystem
    includeDefaultRoots: false
    watchFollowSymlinks: false
    bundledSkillDir: !!js (() => { if (!process.env.DSH_ANQI_SKILLS_ROOT) throw new Error('DSH_ANQI_SKILLS_ROOT is required'); return process.env.DSH_ANQI_SKILLS_ROOT; })()

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: dsh-anqi
  name: '../../plugins/dsh-anqi/index.js'
  config:
    baseURL: !!js process.env.ANQI_BASE_URL ?? 'http://127.0.0.1:3007'
    internalKeyEnv: !!js process.env.ANQI_INTERNAL_KEY_ENV ?? 'ANJIAN_INTERNAL_KEY'
