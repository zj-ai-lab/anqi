# anqi DSH sidecar 的宿主面 Cordis 组合。
#
# 以当前上游 dsh-base 为基线的案齐薄覆盖；`tools/test-dsh-base-parity.js` 负责
# 机械核验上游新增 row 没有被静默遗漏。本文件与 preset/、plugins/、mcp/ 同处
# src/agent/assets/，supervisor.js 拉起子进程时把 cwd 钉死为本目录（assets 根）。
#
# stdout 只承载 JSON-RPC frame；诊断走 stderr（§9 踩坑 #4）。
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  config:
    root: ['.']

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: anqi
    roots:
      - path: !!js process.cwd() + '/preset'
        trust: system
    includeUserRoot: false

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.runtime/sessions'
    compression: none

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# 完整档按当前 dsh-base 的功能面装载；project 档不发布命令、联网、子 Agent
# 或工作流工具。每个 worker 的能力档在 spawn 时钉死，切档会由宿主停止旧 worker。
- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full' || process.platform === 'win32'
  config:
    timeoutMs: 60000

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full' || process.platform !== 'win32'

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full' || process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full' || process.platform !== 'win32'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: commands
  name: '@deepseek-ai/dsh-commands'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: command-feedback
  name: '@deepseek-ai/dsh-command-feedback'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: goal
  name: '@deepseek-ai/dsh-goal'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    section: >-
      You are in plan mode. Inspect the case workspace with non-mutating tools,
      produce a decision-complete plan, and do not edit files or run mutating
      commands until the user approves the plan and plan mode exits.

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    providerName: fork

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: spill-local
  name: '@deepseek-ai/dsh-spill-local'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    maxInlineBytes: 50000

- id: session-checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    subagentProvider: spawn
    maxRounds: 64

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    maxOutputChars: 16000

- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500

- id: web
  name: '@deepseek-ai/dsh-web'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    fetch: false
    searchTimeoutMs: 60000

# 权限档位由 supervisor 根据案齐设置写入最小子进程 env：project=read-only，
# full=workspace-write；绝不继承用户 shell 里的同名变量。审批始终 ask，扩大单次
# 命令权限必须走已有的反向 JSON-RPC 人工卡片。
#
# workspaceRoot/fs-sandbox.cwd/mcp cwd 三处都必须 fail-closed，不能给
# process.env.DSH_CWD 兜底成 process.cwd()：supervisor.js 的 buildSpawnEnv 每次
# spawn 都会设置 DSH_CWD，正常路径下这个变量永远存在；一旦某条未来的 spawn 路径
# 漏传它，`?? process.cwd()` 会让模型的沙箱根悄悄变成本文件所在的 anqi 源码
# assets 目录而不是报错退出——那是比"进程直接崩掉"危险得多的静默降级。下面三处
# 改成"缺失就抛错"，让配置装载在那种情况下直接失败。
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    workspaceRoot: !!js (() => { if (!process.env.DSH_CWD) throw new Error('DSH_CWD is required'); return process.env.DSH_CWD; })()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# Phase 1 已挂统一 pre-execute 闸门；web_search、bash 全量进入审批链。标准
# 文件工具只在写目标越出当前案件夹时进入 path-only 审批，夹内读/写/搜不送判。
# fetch 仍关闭，未知/未来工具没有任何自动放行。
- id: anqi-tool-approval
  name: './plugins/dsh-anqi-tool-approval/index.js'
  disabled: !!js process.env.DSH_CAPABILITY_MODE !== 'full'
  config:
    askTools: [web_search, bash]
    outsideWriteTools: [write, edit, str_replace_editor]
    workspaceRoot: !!js (() => { if (!process.env.DSH_CWD) throw new Error('DSH_CWD is required'); return process.env.DSH_CWD; })()

# permission preset 是上游完整能力的一部分；project 档固定 read-only，full
# 档固定 workspace-write，当前案齐抽屉不提供会话中途切换到 danger-full-access。

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: tools
  name: '@deepseek-ai/dsh-tools'

# glob/grep 直接拉起 ripgrep，并不经过 ctx.fs；这个 around-dispatch guard
# 单独封住它们的显式 path 与 symlink 逃逸。
- id: anqi-workspace-guard
  name: './plugins/dsh-anqi-workspace-guard/index.js'
  config:
    filesRoot: !!js (() => { if (!process.env.DSH_ANQI_FILES_ROOT) throw new Error('DSH_ANQI_FILES_ROOT is required'); return process.env.DSH_ANQI_FILES_ROOT; })()
    databasePath: !!js (() => { if (!process.env.DSH_ANQI_DB_PATH) throw new Error('DSH_ANQI_DB_PATH is required'); return process.env.DSH_ANQI_DB_PATH; })()
    tempRoot: !!js (() => { if (!process.env.DSH_ANQI_SANDBOX_TMP) throw new Error('DSH_ANQI_SANDBOX_TMP is required'); return process.env.DSH_ANQI_SANDBOX_TMP; })()

# system-prompt 是 host-owned service，不能在 preset 里再发布一份（§9 踩坑 #16）；
# 宿主保留空 registry，真正的人设文本来自 preset 里 scope-only 的 dsh-persona。
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: fs-sandbox
  name: './plugins/dsh-anqi-fs/index.js'
  config:
    cwd: !!js (() => { if (!process.env.DSH_CWD) throw new Error('DSH_CWD is required'); return process.env.DSH_CWD; })()

# 模型可见工具继续由 preset/anqi 按 exact agent scope 挂载。filesystem provider
# 在宿主面唯一注册，所有标准文件消费者自然复用同一 containment。

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: !!js (process.env.DSH_PROVIDER_KIND ?? 'deepseek-official') !== 'deepseek-official'
  config:
    apiKeyEnv: !!js process.env.DSH_API_KEY_ENV ?? 'DEEPSEEK_API_KEY'
    baseURL: !!js process.env.DSH_BASE_URL ?? 'https://api.deepseek.com'
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: !!js (process.env.DSH_PROVIDER_KIND ?? 'deepseek-official') !== 'openai-completions'
  config:
    providers:
      anqi-openai:
        displayName: Anqi OpenAI-compatible endpoint
        apiKeyEnv: !!js process.env.DSH_API_KEY_ENV ?? 'OPENAI_API_KEY'
        api: openai-completions
        baseURL: !!js process.env.DSH_BASE_URL
        models:
          - id: !!js process.env.DSH_MODEL
            name: !!js process.env.DSH_MODEL

# 内置的单案 MCP 是 dsh-mcp-client 的受控实例。第三方 MCP 不在这里默认挂载；
# 只能由设置页校验过的绝对路径 Cordis patch 在 full 档加入，工具名遵循
# mcp__<server>__<tool>，并在投入日常实例前跑完整 parity/真实启动门禁。
- id: mcp-anqi-local
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: anqi-local
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/mcp/server.mjs'
    env: {}
    cwd: !!js (() => { if (!process.env.DSH_CWD) throw new Error('DSH_CWD is required'); return process.env.DSH_CWD; })()
    toolCallTimeoutMs: 60000
    failOnStartupError: true

- id: sdk-jsonrpc-server
  name: './plugins/dsh-anqi-jsonrpc/index.js'
  config:
    maxTokensAsSuccess: false
    preflightTimeoutMs: !!js Number(process.env.DSH_PREFLIGHT_TIMEOUT_MS ?? 60000)
