<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F7F8">
<link rel="icon" type="image/png" sizes="256x256" href="/assets/anjian-icon.png">
<link rel="manifest" href="/assets/manifest.webmanifest">
<title>登录 · 案齐</title>
<!-- 防闪烁：CSS 之前把皮肤铺好。9 页一字不差，逻辑与 js/skin.js 的 getSkin() 一致。
     旧键 anjian-theme(light|dark|auto) 就地迁移到 anjian-skin(pro|paper|jade|auto) 并删除；
     auto = 不设 data-skin（由 CSS @media prefers-color-scheme 回落 jade），契约见 css/style.css 层 B。 -->
<script>(function(){var D=document.documentElement,K='anjian-skin',O='anjian-theme',BG={pro:'#F6F7F8',paper:'#F4EFE3',jade:'#050D0A'},L={light:'pro',dark:'jade',auto:'auto'},s=null;try{s=localStorage.getItem(K);if(!s){var o=localStorage.getItem(O);if(o!==null){s=L[o]||'auto';localStorage.setItem(K,s);localStorage.removeItem(O);}}}catch(e){}if(s!=='pro'&&s!=='paper'&&s!=='jade'&&s!=='auto')s='auto';var r=s==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'jade':'pro'):s;if(s==='auto')D.removeAttribute('data-skin');else D.setAttribute('data-skin',s);D.style.colorScheme=s==='auto'?'light dark':(r==='jade'?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',BG[r]);})();</script>
<link rel="stylesheet" href="/css/fonts.css?v=1">
<link rel="stylesheet" href="/css/style.css?v=2.5.3">
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <h1 class="brand"><span class="seal" aria-hidden="true">齐</span>案齐 ANQI</h1>
    <div class="sub">方律个人案件管理 · 登录后 30 天内免密</div>
    <form id="f">
      <label class="f">用户名<input name="username" autocomplete="username" required autofocus></label>
      <label class="f">密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">登录</button>
      <div class="login-err" id="err" role="alert"></div>
    </form>
  </div>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const body = Object.fromEntries(new FormData(e.target).entries());
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      err.textContent = d.error || `登录失败（${res.status}）`;
      return;
    }
    location.href = '/';
  } catch {
    err.textContent = '网络错误，稍后再试';
  }
});
</script>
</body>
</html>
