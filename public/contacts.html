<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F7F8">
<link rel="icon" type="image/png" sizes="256x256" href="/assets/anjian-icon.png">
<link rel="manifest" href="/assets/manifest.webmanifest">
<title>通讯录 · 案齐</title>
<script>(function(){var D=document.documentElement,K='anjian-skin',O='anjian-theme',BG={pro:'#F6F7F8',paper:'#F4EFE3',jade:'#050D0A'},L={light:'pro',dark:'jade',auto:'auto'},s=null;try{s=localStorage.getItem(K);if(!s){var o=localStorage.getItem(O);if(o!==null){s=L[o]||'auto';localStorage.setItem(K,s);localStorage.removeItem(O);}}}catch(e){}if(s!=='pro'&&s!=='paper'&&s!=='jade'&&s!=='auto')s='auto';var r=s==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'jade':'pro'):s;if(s==='auto')D.removeAttribute('data-skin');else D.setAttribute('data-skin',s);D.style.colorScheme=s==='auto'?'light dark':(r==='jade'?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',BG[r]);})();</script>
<link rel="stylesheet" href="/css/fonts.css?v=1">
<link rel="stylesheet" href="/css/style.css?v=2.5.3">
</head>
<body>
<main class="page contacts-page">
  <div class="pagehead">
    <h1 class="page-title">通讯录</h1>
    <p class="page-sub" id="contacts-subtitle">跨案件合作对象 · 先建对象，再加入具体案件</p>
  </div>

  <section class="panel" aria-label="通讯录对象">
    <div class="p-head">
      <h2 class="p-title">合作对象</h2>
      <span class="p-meta" id="contacts-meta">加载中……</span>
      <button class="btn small primary" type="button" id="person-add-toggle">新增对象</button>
    </div>
    <div class="factstrip" id="person-add-more" hidden>
      <form id="person-form">
        <div class="formgrid">
          <label class="f">姓名<input name="name" required placeholder="李律师"></label>
          <label class="f">电话<input name="phone" type="tel" placeholder="可空"></label>
          <label class="f">律所 / 单位<input name="org" placeholder="××律师事务所"></label>
          <label class="f grow">备注<input name="note" placeholder="合作范围、微信等，可空"></label>
        </div>
        <div class="formrow"><button class="btn primary" type="submit">保存对象</button></div>
      </form>
    </div>
    <div class="panel-body" id="people-list"></div>
  </section>
</main>
<script type="module" src="/js/contacts.js?v=2.7.2"></script>
</body>
</html>
