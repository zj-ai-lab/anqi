name: Feature request
description: 提议一个明确的问题或使用场景
labels:
  - enhancement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请描述要解决的问题，而不是提交一份实现。案齐目前不接收外部 Pull Request，也请不要在 Issue 中粘贴完整补丁或大段代码。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景遇到什么阻碍？请只使用虚构、脱敏信息。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述可观察的行为和成功标准，不必指定内部实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代办法
      description: 现有功能、手工流程或外部工具为什么不足？

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 案件与程序阶段
        - 期限引擎
        - 待办、日志与日历
        - 收件箱与 LLM 辅助
        - 文件与检索
        - 费用与合作分成
        - UI 与无障碍
        - 自托管与运维
        - 桌面或移动端
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 内容不含真实案件、当事人信息、凭据或其他敏感数据。
          required: true
        - label: 这不是安全漏洞；安全问题应使用私密漏洞报告。
          required: true
        - label: 我没有粘贴完整补丁、成段实现代码或可直接合并的文件。
          required: true
        - label: 我理解项目目前不接收外部 Pull Request，但可以按 AGPL 在自己的 Fork 中实现。
          required: true
