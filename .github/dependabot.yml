version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      electron-toolchain:
        patterns:
          - electron
          - electron-builder
          - electron-updater
          - "@electron/rebuild"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - electron
          - electron-builder
          - electron-updater
          - "@electron/rebuild"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
