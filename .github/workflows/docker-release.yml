# 案齐 Docker 发行：v* tag 推送多架构镜像到 GHCR；workflow_dispatch 固定为 dry-run。
name: docker-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "固定为 true：只构建、冒烟并上传 OCI artifact"
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Require dry-run for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test "$REQUESTED_DRY_RUN" = "true" || {
            echo "FATAL: workflow_dispatch 永远只允许 dry-run"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Resolve and verify version
        id: version
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            [ "$TAG_VER" = "$PKG_VER" ] || {
              echo "FATAL: tag $TAG_VER != package.json $PKG_VER"
              exit 1
            }
          fi
          echo "version=$PKG_VER" >> "$GITHUB_OUTPUT"
          echo "minor=${PKG_VER%.*}" >> "$GITHUB_OUTPUT"
          # 预发行判定：与 release.yml「Publish GitHub Release assets」步骤
          # 同一条正则（语义化版本 MAJOR.MINOR.PATCH 之后紧跟一个 "-"，例如
          # 2.7.0-beta.1）——预发行版本只推 :<version> 一个标签，绝不能碰
          # :latest / :<minor>，否则会把 beta/rc 当稳定版推给所有拉 latest
          # 的现网部署。对 2.7.0-beta.1 这类版本，"minor" 输出（$PKG_VER%.*
          # 只切掉最后一个点后的段）还会算出 "2.7.0-beta" 这种没有意义的
          # 诡异标签，预发行分支下这个 minor 输出本身就不会被使用。
          is_prerelease=false
          if [[ "$PKG_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            is_prerelease=true
            echo "版本 $PKG_VER 带预发行段，本次发布只推 :$PKG_VER 一个标签"
          fi
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: anqi-smoke:${{ steps.version.outputs.version }}

      - name: Smoke test image and fail-closed startup
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="anqi-smoke:$VERSION"
          if docker run --rm -e DB_PATH=/tmp/fail-closed.db "$image" >fail-closed.log 2>&1; then
            echo "FATAL: missing credentials unexpectedly started"
            exit 1
          fi
          # 无凭据启动必须因 fail-closed 拒绝，且拒绝理由指向凭据配置
          # （完全未配置时的错误文案提到 ANJIAN_UNSAFE_NO_AUTH，只配一半时提到 ANJIAN_USER）
          if ! grep -Eq "ANJIAN_USER|ANJIAN_UNSAFE_NO_AUTH|登录凭据" fail-closed.log; then
            echo "FATAL: fail-closed refusal did not mention credential configuration"
            cat fail-closed.log
            exit 1
          fi

          HASH=$(ANJIAN_PASSWORD='ci-smoke-password' node tools/hash-password.js)
          cleanup() { docker rm -f anqi-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name anqi-smoke \
            -e DB_PATH=/tmp/smoke.db \
            -e ANJIAN_USER=ci-smoke \
            -e ANJIAN_PASS_HASH="$HASH" \
            -e ANJIAN_INTERNAL_KEY=ci-smoke-internal-key \
            -p 127.0.0.1:3000:3000 \
            "$image"
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz | grep -q '"ok":true'; then
              ready=1
              break
            fi
            sleep 1
          done
          [ -n "$ready" ] || {
            docker logs anqi-smoke
            exit 1
          }
          IMAGE_VERSION=$(docker exec anqi-smoke node -p "require('/app/package.json').version")
          [ "$IMAGE_VERSION" = "$VERSION" ]

          # AI 助理 runtime 依赖的机械回归断言：防止 Dockerfile 将来再退化成
          # 「COPY src ./src 带进源码、但从不装 src/agent/runtime 的
          # node_modules」——这条断言曾经是本次改动要修的坑本身，见 Dockerfile
          # 里 "AI 助理（DSH sidecar）运行时依赖" 那一层的注释。两条都要过：
          # 目录真的存在，且其中一个真实依赖能被 require() 加载（不是空目录
          # 或者装错了架构的原生模块）。
          docker exec anqi-smoke test -d /app/src/agent/runtime/node_modules || {
            echo "FATAL: /app/src/agent/runtime/node_modules 不存在——AI 助理 runtime 依赖没有被装进镜像"
            exit 1
          }
          docker exec -w /app/src/agent/runtime anqi-smoke node -e "require('@deepseek-ai/dsh-base/package.json'); console.log('dsh-base OK')" || {
            echo "FATAL: 镜像里的 @deepseek-ai/dsh-base 无法 require()——runtime 依赖装了但加载不了（架构不匹配或安装不完整）"
            exit 1
          }

      - name: Build multi-arch OCI dry-run archive
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/anqi-${{ steps.version.outputs.version }}.oci.tar

      - name: Generate OCI SHA-256
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "anqi-${VERSION}.oci.tar" > "anqi-${VERSION}.oci.tar.sha256"
          sha256sum -c "anqi-${VERSION}.oci.tar.sha256"

      - name: Upload Docker dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: docker-oci-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/anqi-${{ steps.version.outputs.version }}.oci.tar
            ${{ runner.temp }}/anqi-${{ steps.version.outputs.version }}.oci.tar.sha256

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve publish tags
        id: tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MINOR: ${{ needs.build.outputs.minor }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          # 预发行版本（is_prerelease，判定见 build 任务的「Resolve and verify
          # version」步骤）只推 :<version> 一个标签——绝不能碰 :latest 或
          # :<minor>：一旦推了 :latest，任何 `docker pull anqi:latest` 或
          # docker-compose 没钉版本号的现网部署都会静默升级到 beta/rc；
          # :<minor> 对 2.7.0-beta.1 这类版本还会算出 "2.7.0-beta" 这种没人
          # 会去拉、纯属误导的标签。正式版本行为不变，三个标签照旧全推。
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "预发行版本 ${VERSION}：只推 :${VERSION}，跳过 :${MINOR} 与 :latest"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "ghcr.io/zj-ai-lab/anqi:${VERSION}"
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "ghcr.io/zj-ai-lab/anqi:${MINOR}"
              echo "ghcr.io/zj-ai-lab/anqi:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/zj-ai-lab/anqi
            org.opencontainers.image.version=${{ needs.build.outputs.version }}

      - name: Record immutable digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Published digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
