# Flat sidecar composition for @deepseek-ai/dsh-sdk-jsonrpc-demo.
# The engine/service rows below are the smallest runnable subset copied from
# @deepseek-ai/dsh-base@0.1.0-rc.7. stdout is reserved for JSON-RPC frames.

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: anqi
    roots:
      - path: !!js process.cwd() + '/preset'
        trust: system
    includeUserRoot: false

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.runtime/sessions'
    compression: none

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

# `dsh-permission-presets` 只是把 sandbox 模式 + 审批策略打包成可切换预设的 UI 面，
# 它 inject `shell`（bash 执行器）；本组合刻意不挂 bash，挂上它会让整棵树在
# app-boot 的 assertEntriesActivated 处失败（实测 rc.7：pending waiting for service: shell）。
# 真正生效的旋钮是上面的 sandbox-policy.mode 与 user-approval.policy，这里不再挂它。

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: tools
  name: '@deepseek-ai/dsh-tools'

# The registry is host-owned; the mounted preset shadows its empty persona in
# the exact agent scope instead of publishing another process-global service.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# Model-facing filesystem, skill, question, todo, and anqi domain tools live
# only in preset/anqi; the JSON-RPC server mounts that preset before publishing
# each session. No bash/pwsh/subagent/workflow/ralph/web tools are mounted.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: !!js (process.env.DSH_PROVIDER_KIND ?? 'deepseek-official') !== 'deepseek-official'
  config:
    apiKeyEnv: !!js process.env.DSH_API_KEY_ENV ?? 'DEEPSEEK_API_KEY'
    baseURL: !!js process.env.DSH_BASE_URL ?? 'https://api.deepseek.com'
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-chat'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: !!js (process.env.DSH_PROVIDER_KIND ?? 'deepseek-official') !== 'openai-completions'
  config:
    providers:
      anqi-openai:
        displayName: Anqi OpenAI-compatible endpoint
        apiKeyEnv: !!js process.env.DSH_API_KEY_ENV ?? 'OPENAI_API_KEY'
        api: openai-completions
        baseURL: !!js process.env.DSH_BASE_URL
        models:
          - id: !!js process.env.DSH_MODEL
            name: !!js process.env.DSH_MODEL

- id: mcp-anqi-local
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: anqi-local
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/mcp/server.mjs'
    env: {}
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    toolCallTimeoutMs: 60000
    failOnStartupError: true

- id: sdk-jsonrpc-server
  name: './plugins/dsh-anqi-jsonrpc/index.js'
  config:
    maxTokensAsSuccess: false
