# 案齐安卓壳 · Gradle 配置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# 注意：这里**不要**写 org.gradle.java.home。flow-widget 里钉死了本机 Android Studio 的 JBR，
# 但本工程还要在 GitHub Actions 的 ubuntu runner 上构建，钉死本机路径会直接构建失败。
# 本机构建前 export JAVA_HOME 即可（见 README.md）。

# --- 本机 OpenClash 透明代理的网络缓解（照抄 flow-widget，实测有效）---
# 代理会在 Gradle 并发拉 Maven 时随机掐 TLS 握手，故串行 + 重试，让多次运行能累积缓存。
org.gradle.parallel=false
org.gradle.workers.max=1
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
